<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="viraBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071426" />
      <stop offset="55%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#12305C" />
    </linearGradient>
    <linearGradient id="viraArcTop" x1="120" y1="90" x2="430" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="viraArcBottom" x1="80" y1="260" x2="380" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#viraBg)" />
  <rect x="16" y="16" width="480" height="480" rx="98" stroke="#3B82F6" stroke-opacity="0.28" stroke-width="4" />

  <!-- Orbital swoosh superior (movimento e tecnologia) -->
  <path
    d="M148 164C204 102 318 90 388 144C424 172 428 220 400 256C394 202 360 156 304 142C246 128 188 140 148 164Z"
    fill="url(#viraArcTop)"
  />

  <!-- Orbital swoosh inferior -->
  <path
    d="M364 348C308 410 194 422 124 368C88 340 84 292 112 256C118 310 152 356 208 370C266 384 324 372 364 348Z"
    fill="url(#viraArcBottom)"
  />

  <!-- Lente central de pesquisa empresarial e conexão -->
  <circle cx="246" cy="248" r="64" stroke="#FFFFFF" stroke-width="22" />
  <line x1="292" y1="294" x2="344" y2="346" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" />

  <!-- Nó de conexão comercial dentro da lente -->
  <circle cx="246" cy="248" r="18" fill="#60A5FA" />
  <circle cx="246" cy="248" r="7" fill="#FFFFFF" />
</svg>
